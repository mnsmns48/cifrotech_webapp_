version: "3.9"

services:
  c_webapp:
    image: c_webapp_image:latest
    container_name: c_webapp
    depends_on:
      - postgres
      - redis
    working_dir: /cifrotech_webapp_

    environment:
      MODE: dev
      SP: /run/secrets/app_env

    volumes:
      - .:/cifrotech_webapp_
      - /Users/smdlkhn/Documents/cifrotech_env/.env:/run/secrets/app_env:ro

    ports:
      - "5000:5000"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
